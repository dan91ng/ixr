<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#eef7f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#5f6b7a"/>
    </marker>
  </defs>
  <rect width="1200" height="360" rx="26" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#172033">v2rayN 新手四步上手</text>
  <g filter="url(#shadow)" font-family="Microsoft YaHei, sans-serif">
    <rect x="55" y="105" width="235" height="180" rx="20" fill="#ffffff"/>
    <circle cx="173" cy="145" r="25" fill="#1677ff"/>
    <text x="173" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">1</text>
    <text x="173" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">下载并解压</text>
    <text x="173" y="242" text-anchor="middle" font-size="18" fill="#536071">只用官方 GitHub</text>

    <rect x="345" y="105" width="235" height="180" rx="20" fill="#ffffff"/>
    <circle cx="463" cy="145" r="25" fill="#7c3aed"/>
    <text x="463" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">2</text>
    <text x="463" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">导入订阅</text>
    <text x="463" y="242" text-anchor="middle" font-size="18" fill="#536071">粘贴订阅地址并更新</text>

    <rect x="635" y="105" width="235" height="180" rx="20" fill="#ffffff"/>
    <circle cx="753" cy="145" r="25" fill="#d97706"/>
    <text x="753" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">3</text>
    <text x="753" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">选择节点</text>
    <text x="753" y="242" text-anchor="middle" font-size="18" fill="#536071">设为活动服务器</text>

    <rect x="925" y="105" width="235" height="180" rx="20" fill="#ffffff"/>
    <circle cx="1043" cy="145" r="25" fill="#0f9f6e"/>
    <text x="1043" y="154" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">4</text>
    <text x="1043" y="205" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">开启系统代理</text>
    <text x="1043" y="242" text-anchor="middle" font-size="18" fill="#536071">浏览器即可使用</text>
  </g>
  <g stroke="#5f6b7a" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M300 195 H332"/>
    <path d="M590 195 H622"/>
    <path d="M880 195 H912"/>
  </g>
  <text x="600" y="328" text-anchor="middle" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#64748b">v2rayN 只是客户端：使用前需要合法取得订阅地址或服务器配置</text>
</svg>
